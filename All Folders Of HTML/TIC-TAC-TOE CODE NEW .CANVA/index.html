  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #172033;
      --paper: #fffdf7;
      --x: #e65e49;
      --o: #246bca;
      --mint: #c8f1d4;
      --line: #dfe4ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
    }

    .game-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    .game-shell::before,
    .game-shell::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      z-index: -1;
      pointer-events: none;
    }

    .game-shell::before {
      width: 24rem;
      height: 24rem;
      top: -10rem;
      left: -8rem;
      background: rgba(255, 207, 102, 0.26);
    }

    .game-shell::after {
      width: 22rem;
      height: 22rem;
      bottom: -11rem;
      right: -7rem;
      background: rgba(73, 162, 255, 0.20);
    }

    .game-panel {
      width: min(100%, 32rem);
      background: var(--paper);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 2rem;
      box-shadow: 0 24px 70px rgba(10, 31, 61, .25);
      padding: clamp(1.5rem, 5vw, 2.5rem);
      animation: rise-in .55s ease both;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .title-face {
      font-family: "Fraunces", serif;
      letter-spacing: -0.045em;
    }

    .player-key {
      border: 1px solid var(--line);
      background: #ffffff;
    }

    .player-mark {
      width: 2rem;
      height: 2rem;
      border-radius: .65rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .mark-x { color: var(--x); background: #ffe4de; }
    .mark-o { color: var(--o); background: #e3efff; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .65rem;
      width: 100%;
      margin: 1.5rem 0;
    }

    .cell {
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: 1.15rem;
      background: #edf1f5;
      color: var(--ink);
      cursor: pointer;
      font-family: "Fraunces", serif;
      font-size: clamp(2.35rem, 12vw, 4.2rem);
      font-weight: 700;
      line-height: 1;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .cell:not(:disabled):hover {
      background: #e3eaf1;
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(23, 32, 51, .11);
    }

    .cell:focus-visible,
    .restart-control:focus-visible {
      outline: 4px solid #f5bb35;
      outline-offset: 3px;
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.x-mark { color: var(--x); }
    .cell.o-mark { color: var(--o); }

    .cell.winner {
      background: var(--mint);
      box-shadow: inset 0 0 0 2px #61b97c, 0 8px 15px rgba(53, 132, 76, .14);
      animation: winner-pop .38s ease both;
    }

    @keyframes winner-pop {
      0% { transform: scale(.92); }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .status-box {
      min-height: 3.25rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 1rem;
      padding: .65rem 1rem;
      text-align: center;
      background: #f2f4f6;
      font-weight: 700;
    }

    .restart-control {
      border: 0;
      border-radius: .9rem;
      padding: .9rem 1.15rem;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: .55rem;
      cursor: pointer;
      transition: transform .16s ease, filter .16s ease;
    }

    .restart-control:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    @media (max-width: 380px) {
      .game-shell { padding: .85rem; }
      .game-panel { border-radius: 1.5rem; padding: 1.25rem; }
      .board { gap: .45rem; margin: 1.1rem 0; }
      .cell { border-radius: .85rem; }
    }
  </style>

 <body data-template-id="__page-root" style="background: linear-gradient(135deg, rgb(18, 57, 103), rgb(31, 100, 148));">

  <script src="/_sdk/a051f9537983733d.editing_sdk.js" integrity="sha512-IWn3eBHnVt7zQ0Rp79J72qSgJoLbskCA9lcfY4retf+5km4LjuhSHpvx+182KCHmEZ6EbJtWqVsybpV8Sd8PQQ=="></script>
  <script>
    const cells = Array.from(document.querySelectorAll(".cell"));
    const statusElement = document.getElementById("game-status");
    const restartButton = document.getElementById("restart-button");
    const winningPatterns = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill("");
    let currentPlayer = "X";
    let gameActive = true;

    function updateStatus(message) {
      statusElement.textContent = message;
    }

    function winnerPattern() {
      return winningPatterns.find(pattern => {
        const [a, b, c] = pattern;
        return board[a] && board[a] === board[b] && board[a] === board[c];
      });
    }

    function markCell(cell, player) {
      const index = Number(cell.dataset.index);
      cell.textContent = player;
      cell.classList.add(player === "X" ? "x-mark" : "o-mark");
      cell.setAttribute("aria-label", `${player} in cell ${index + 1}`);
      cell.disabled = true;
    }

    function handleMove(event) {
      const cell = event.currentTarget;
      const index = Number(cell.dataset.index);

      if (!gameActive || board[index]) return;

      board[index] = currentPlayer;
      markCell(cell, currentPlayer);

      const winningCells = winnerPattern();
      if (winningCells) {
        gameActive = false;
        winningCells.forEach(winningIndex => cells[winningIndex].classList.add("winner"));
        cells.forEach(item => { item.disabled = true; });
        updateStatus(`Player ${currentPlayer} wins!`);
        return;
      }

      if (board.every(cellValue => cellValue !== "")) {
        gameActive = false;
        updateStatus("It’s a draw — play again!");
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus(`Player ${currentPlayer}'s turn`);
    }

    function resetGame() {
      board = Array(9).fill("");
      currentPlayer = "X";
      gameActive = true;

      cells.forEach((cell, index) => {
        const row = Math.floor(index / 3) + 1;
        const column = (index % 3) + 1;
        cell.textContent = "";
        cell.disabled = false;
        cell.classList.remove("x-mark", "o-mark", "winner");
        cell.setAttribute("aria-label", `Empty cell, row ${row} column ${column}`);
      });

      updateStatus("Player X's turn");
      cells[0].focus();
    }

    cells.forEach(cell => cell.addEventListener("click", handleMove));
    restartButton.addEventListener("click", resetGame);

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
